{# search box + mode switch, shared by the library home and collection pages #}
		<form class="rd-search" id="rd-search-form" role="search" autocomplete="off">
			<label class="sr-only" for="rd-q">{{ _("Search") }}</label>
			<input id="rd-q" name="q" type="search" class="rd-search__input"
				placeholder="{{ _('Search titles, authors, subjects… (ಕನ್ನಡದಲ್ಲೂ ಹುಡುಕಿ)') }}" />
			<button class="rd-btn rd-btn--primary" type="submit">{{ _("Search") }}</button>
		</form>

		<div class="rd-modes" role="radiogroup" aria-label="{{ _('Search mode') }}">
			<label><input type="radio" name="rd-mode" value="books" checked> {{ _("Books") }}</label>
			<label><input type="radio" name="rd-mode" value="pages"> {{ _("Inside the text") }}</label>
			<span class="rd-muted rd-count">{{ frappe.format(item_count, {"fieldtype": "Int"}) }} {{ _("books in the catalogue") }}</span>
		</div>
		<div class="rd-searchopts">
			<label>{{ _("Match") }}
				<select id="rd-match">
					<option value="">{{ _("Similar words") }}</option>
					<option value="all">{{ _("All the words") }}</option>
					<option value="exact">{{ _("Exact phrase") }}</option>
				</select>
			</label>
			<label>{{ _("Search in") }}
				<select id="rd-in">
					<option value="">{{ _("Everywhere") }}</option>
					<option value="title">{{ _("Title") }}</option>
					<option value="creators">{{ _("Author") }}</option>
					<option value="publisher">{{ _("Publisher") }}</option>
					<option value="subjects">{{ _("Subject") }}</option>
					<option value="description">{{ _("Description") }}</option>
				</select>
			</label>
		</div>
