[project]
name = "sok_resdesk"
authors = [
    { name = "Servants of Knowledge", email = "omshivaprakash@gmail.com" }
]
description = "Research Desk: an open research portal and digital library for Servants of Knowledge and Internet Archive collections, built on Frappe"
requires-python = ">=3.14"
readme = "README.md"
license = "MIT"
dynamic = ["version"]
# No third-party dependencies beyond what Frappe already ships (requests).
# boto3: the second preservation copy on S3-compatible storage (core/replica.py)
dependencies = ["boto3>=1.34"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501", "B017", "W191", "E101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"

[tool.pytest.ini_options]
testpaths = ["sok_resdesk/tests"]
python_files = ["test_core.py", "test_push.py", "test_docs.py", "unit_*.py"]
