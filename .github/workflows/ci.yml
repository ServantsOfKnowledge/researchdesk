name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint + core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff pytest requests
      - run: ruff check sok_resdesk
      - run: pytest -q sok_resdesk/tests/test_core.py sok_resdesk/tests/unit_folder.py
      - run: bash -n install.sh resdesk.sh upgrade.sh scripts/*.sh docker/create-site.sh

  docker-install:
    name: Docker install + integration tests
    runs-on: ubuntu-latest
    needs: lint-and-unit
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install with the same script librarians use
        run: ./install.sh --yes --no-sample
      - name: Frappe integration tests
        run: |
          ./resdesk.sh bench set-config allow_tests true
          docker compose exec -T backend bench --site resdesk.localhost run-tests --app sok_resdesk
      - name: Small live ingest from the Internet Archive
        run: ./resdesk.sh ingest --collection ServantsOfKnowledge --filter "language:eng" --limit 3
      - name: Smoke-test public endpoints
        run: |
          set -e
          B=http://localhost:8080
          curl -fsS "$B/library" > /dev/null
          curl -fsS "$B/api/method/sok_resdesk.api.search?q=india" | grep -q '"hits"'
          curl -fsS "$B/api/method/sok_resdesk.oai.endpoint?verb=Identify" | grep -q "<Identify>"
          curl -fsS "$B/api/method/sok_resdesk.api.stats"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
