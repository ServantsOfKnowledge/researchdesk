<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif"><title id="t">Governance Mode: who sees a classified record</title><desc id="d">Every request passes the plain visibility rules, then a classified or department-scoped record is shown only to a signed-in person whose clearance level is high enough and whose offices include the record's department or are above it. Otherwise it is not found at all. Offices read downward. The audit log is a chain of hashed lines. Search, lists, pages, files, feeds, exports, pushes and the Desk all enforce it.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa7b2"/></marker><marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1362c"/></marker></defs><rect width="1200" height="800" fill="#ffffff"/><text x="30" y="32" font-size="20" font-weight="700" fill="#1f272e" text-anchor="start">Governance Mode: who sees a classified record, and what is written down</text><text x="30" y="66" font-size="13" font-weight="700" fill="#5b6670" text-anchor="start">1  THE DECISION, ON EVERY REQUEST</text><rect x="30" y="82" width="150" height="74" rx="10" fill="#eef3fb" stroke="#2b5f9e" stroke-width="1.6"/><text x="42" y="105" font-size="14" font-weight="700" fill="#2b5f9e" text-anchor="start">A request</text><text x="42" y="125" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">search, page, file,</text><text x="42" y="142" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">export, push</text><rect x="220" y="82" width="200" height="74" rx="10" fill="#f6f8fa" stroke="#3d4852" stroke-width="1.6"/><text x="232" y="105" font-size="14" font-weight="700" fill="#3d4852" text-anchor="start">Plain rules</text><text x="232" y="125" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">guest mode, member,</text><text x="232" y="142" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">Public / Login to read / find</text><rect x="460" y="82" width="190" height="74" rx="10" fill="#fbf3e8" stroke="#a8650c" stroke-width="1.6"/><text x="472" y="105" font-size="14" font-weight="700" fill="#a8650c" text-anchor="start">Cleared only?</text><text x="472" y="125" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">classified or scoped</text><text x="472" y="142" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">to a department</text><rect x="690" y="82" width="200" height="74" rx="10" fill="#eef3f1" stroke="#2f6f5e" stroke-width="1.6"/><text x="702" y="105" font-size="14" font-weight="700" fill="#2f6f5e" text-anchor="start">Level high enough?</text><text x="702" y="125" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">clearance level ≥</text><text x="702" y="142" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">the record&#x27;s level</text><rect x="930" y="82" width="240" height="74" rx="10" fill="#eef3f1" stroke="#2f6f5e" stroke-width="1.6"/><text x="942" y="105" font-size="14" font-weight="700" fill="#2f6f5e" text-anchor="start">In your offices?</text><text x="942" y="125" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">record&#x27;s department is yours</text><text x="942" y="142" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">or below yours (or none)</text><path d="M180 119 L220 119" stroke="#9aa7b2" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M420 119 L460 119" stroke="#9aa7b2" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M650 119 L690 119" stroke="#9aa7b2" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M890 119 L930 119" stroke="#9aa7b2" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="460" y="196" width="190" height="80" rx="10" fill="#f6f8fa" stroke="#3d4852" stroke-width="1.6"/><text x="472" y="219" font-size="14" font-weight="700" fill="#3d4852" text-anchor="start">Shown as before</text><text x="472" y="239" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">an ordinary record:</text><text x="472" y="256" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">only the plain rules</text><text x="472" y="273" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">apply</text><path d="M555 156 L555 196" stroke="#3d4852" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="561.0" y="172.0" font-size="12" font-weight="700" fill="#3d4852" text-anchor="start">no</text><rect x="690" y="196" width="250" height="64" rx="10" fill="#fbefed" stroke="#a1362c" stroke-width="1.6"/><text x="702" y="219" font-size="14" font-weight="700" fill="#a1362c" text-anchor="start">Not found: no trace</text><text x="702" y="239" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">not in search, counts, pages, files,</text><text x="702" y="256" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">exports, IIIF, OPDS, OAI-PMH, SRU, pushes</text><path d="M790 156 L790 196" stroke="#a1362c" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="796.0" y="172.0" font-size="12" font-weight="700" fill="#a1362c" text-anchor="start">no</text><path d="M950 156 L915 196" stroke="#a1362c" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="938.5" y="172.0" font-size="12" font-weight="700" fill="#a1362c" text-anchor="start">no</text><rect x="970" y="196" width="200" height="64" rx="10" fill="#eef3f1" stroke="#2f6f5e" stroke-width="1.6"/><text x="982" y="219" font-size="14" font-weight="700" fill="#2f6f5e" text-anchor="start">Shown to you</text><text x="982" y="239" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">a signed-in person cleared;</text><text x="982" y="256" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">the Administrator sees all</text><path d="M1070 156 L1070 196" stroke="#2f6f5e" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="1076.0" y="172.0" font-size="12" font-weight="700" fill="#2f6f5e" text-anchor="start">yes</text><text x="30" y="304" font-size="13" font-weight="700" fill="#5b6670" text-anchor="start">2  OFFICES READ DOWNWARD</text><rect x="30" y="316" width="250" height="56" rx="10" fill="#f6eef9" stroke="#7a3e8f" stroke-width="1.6"/><text x="42" y="339" font-size="14" font-weight="700" fill="#7a3e8f" text-anchor="start">Secretariat department</text><text x="42" y="359" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">head office</text><rect x="80" y="388" width="250" height="56" rx="10" fill="#f6f8fa" stroke="#3d4852" stroke-width="1.6"/><text x="92" y="411" font-size="14" font-weight="700" fill="#3d4852" text-anchor="start">Directorate</text><text x="92" y="431" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">sees the offices below</text><rect x="130" y="460" width="250" height="56" rx="10" fill="#f6f8fa" stroke="#3d4852" stroke-width="1.6"/><text x="142" y="483" font-size="14" font-weight="700" fill="#3d4852" text-anchor="start">District office</text><text x="142" y="503" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">sees its taluks</text><rect x="180" y="532" width="250" height="56" rx="10" fill="#f6f8fa" stroke="#3d4852" stroke-width="1.6"/><text x="192" y="555" font-size="14" font-weight="700" fill="#3d4852" text-anchor="start">Taluk office</text><text x="192" y="575" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">sees only its own</text><path d="M100 372 L100 388" stroke="#7a3e8f" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M150 444 L150 460" stroke="#7a3e8f" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M200 516 L200 532" stroke="#7a3e8f" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="30" y="614" font-size="12.5" font-weight="400" fill="#5b6670" text-anchor="start">A clearance is a level plus departments. An office never sees the records of the office above.</text><text x="480" y="304" font-size="13" font-weight="700" fill="#5b6670" text-anchor="start">3  THE AUDIT LOG IS A HASH CHAIN</text><rect x="480" y="316" width="150" height="118" rx="10" fill="#eef3fb" stroke="#2b5f9e" stroke-width="1.6"/><text x="492" y="339" font-size="14" font-weight="700" fill="#2b5f9e" text-anchor="start">Line 1</text><text x="492" y="359" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">who · what · record</text><text x="492" y="376" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">when · address</text><text x="492" y="393" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">hash(start</text><text x="492" y="410" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start"> + this line)</text><rect x="655" y="316" width="150" height="118" rx="10" fill="#eef3fb" stroke="#2b5f9e" stroke-width="1.6"/><text x="667" y="339" font-size="14" font-weight="700" fill="#2b5f9e" text-anchor="start">Line 2</text><text x="667" y="359" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">who · what · record</text><text x="667" y="376" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">when · address</text><text x="667" y="393" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">hash(line 1</text><text x="667" y="410" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start"> + this line)</text><path d="M630 375 L655 375" stroke="#2b5f9e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="830" y="316" width="150" height="118" rx="10" fill="#eef3fb" stroke="#2b5f9e" stroke-width="1.6"/><text x="842" y="339" font-size="14" font-weight="700" fill="#2b5f9e" text-anchor="start">Line 3</text><text x="842" y="359" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">who · what · record</text><text x="842" y="376" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">when · address</text><text x="842" y="393" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">hash(line 2</text><text x="842" y="410" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start"> + this line)</text><path d="M805 375 L830 375" stroke="#2b5f9e" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="1005" y="316" width="150" height="118" rx="10" fill="#eef3fb" stroke="#2b5f9e" stroke-width="1.6"/><text x="1017" y="339" font-size="14" font-weight="700" fill="#2b5f9e" text-anchor="start">Line 4</text><text x="1017" y="359" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">who · what · record</text><text x="1017" y="376" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">when · address</text><text x="1017" y="393" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">hash(line 3</text><text x="1017" y="410" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start"> + this line)</text><path d="M980 375 L1005 375" stroke="#2b5f9e" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="480" y="456" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">Change or remove a line anywhere and every hash after it stops matching:</text><text x="480" y="475" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">“Check the log” says where. The hash is keyed with a secret kept outside the database.</text><rect x="480" y="496" width="330" height="94" rx="10" fill="#fbf3e8" stroke="#a8650c" stroke-width="1.6"/><text x="492" y="519" font-size="14" font-weight="700" fill="#a8650c" text-anchor="start">Written for</text><text x="492" y="539" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">view · download · search</text><text x="492" y="556" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">change of visibility or classification</text><text x="492" y="573" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">clearances granted · sign-in · sign-out</text><rect x="840" y="496" width="330" height="94" rx="10" fill="#fbefed" stroke="#a1362c" stroke-width="1.6"/><text x="852" y="519" font-size="14" font-weight="700" fill="#a1362c" text-anchor="start">Cannot be</text><text x="852" y="539" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">edited or deleted from the Desk or portal;</text><text x="852" y="556" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">a log cut short at its end shows only against</text><text x="852" y="573" font-size="12.5" font-weight="400" fill="#1f272e" text-anchor="start">the last line&#x27;s number and hash, noted elsewhere</text><text x="30" y="650" font-size="13" font-weight="700" fill="#5b6670" text-anchor="start">4  WHERE IT IS ENFORCED</text><rect x="30" y="664" width="180" height="84" rx="10" fill="#f6f8fa" stroke="#9aa7b2" stroke-width="1.4"/><text x="40" y="688" font-size="13" font-weight="700" fill="#3d4852" text-anchor="start">Search</text><text x="40" y="708" font-size="12" font-weight="400" fill="#1f272e" text-anchor="start">engine filter on level</text><text x="40" y="724" font-size="12" font-weight="400" fill="#1f272e" text-anchor="start">and department</text><rect x="220" y="664" width="180" height="84" rx="10" fill="#f6f8fa" stroke="#9aa7b2" stroke-width="1.4"/><text x="230" y="688" font-size="13" font-weight="700" fill="#3d4852" text-anchor="start">Lists and counts</text><text x="230" y="708" font-size="12" font-weight="400" fill="#1f272e" text-anchor="start">SQL condition on every</text><text x="230" y="724" font-size="12" font-weight="400" fill="#1f272e" text-anchor="start">portal count</text><rect x="410" y="664" width="180" height="84" rx="10" fill="#f6f8fa" stroke="#9aa7b2" stroke-width="1.4"/><text x="420" y="688" font-size="13" font-weight="700" fill="#3d4852" text-anchor="start">Pages and files</text><text x="420" y="708" font-size="12" font-weight="400" fill="#1f272e" text-anchor="start">private, never cached</text><rect x="600" y="664" width="180" height="84" rx="10" fill="#f6f8fa" stroke="#9aa7b2" stroke-width="1.4"/><text x="610" y="688" font-size="13" font-weight="700" fill="#3d4852" text-anchor="start">Feeds</text><text x="610" y="708" font-size="12" font-weight="400" fill="#1f272e" text-anchor="start">OAI-PMH · SRU · OPDS ·</text><text x="610" y="724" font-size="12" font-weight="400" fill="#1f272e" text-anchor="start">IIIF: never</text><rect x="790" y="664" width="180" height="84" rx="10" fill="#f6f8fa" stroke="#9aa7b2" stroke-width="1.4"/><text x="800" y="688" font-size="13" font-weight="700" fill="#3d4852" text-anchor="start">Exports and pushes</text><text x="800" y="708" font-size="12" font-weight="400" fill="#1f272e" text-anchor="start">never a classified</text><text x="800" y="724" font-size="12" font-weight="400" fill="#1f272e" text-anchor="start">record</text><rect x="980" y="664" width="180" height="84" rx="10" fill="#f6f8fa" stroke="#9aa7b2" stroke-width="1.4"/><text x="990" y="688" font-size="13" font-weight="700" fill="#3d4852" text-anchor="start">The Desk</text><text x="990" y="708" font-size="12" font-weight="400" fill="#1f272e" text-anchor="start">lists and forms follow</text><text x="990" y="724" font-size="12" font-weight="400" fill="#1f272e" text-anchor="start">clearance</text><text x="30" y="774" font-size="12.5" font-weight="400" fill="#5b6670" text-anchor="start">Hidden classified records stay hidden even if Governance Mode is switched off: the switch only adds the people who are cleared.</text></svg>
