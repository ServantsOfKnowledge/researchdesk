[project]
name = "sok_resdesk_governance"
authors = [
    { name = "Servants of Knowledge", email = "omshivaprakash@gmail.com" }
]
description = "Research Desk Governance: the records-office features (audit log, classification, retention, file register, directory sign-in, disclosure) for a library that needs them"
requires-python = ">=3.14"
license = "MIT"
dynamic = ["version"]
# Needs Research Desk itself (sok_resdesk) installed first; nothing else.
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
