name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint + core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff pytest requests pillow
      - name: Tesseract with the Kannada model (the OCR engine's test reads a rendered page)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends tesseract-ocr tesseract-ocr-kan tesseract-ocr-eng fonts-knda
      - run: ruff check sok_resdesk scripts
      - name: "Code is formatted (fix with: ruff format sok_resdesk scripts)"
        run: ruff format --check sok_resdesk scripts
      # every pure test: test_core, test_push, test_docs and unit_* (pyproject.toml lists them)
      - run: pytest -q
      - name: Docs match the code (see docs/development.md → Keeping the docs current)
        run: pytest -q sok_resdesk/tests/test_docs.py
      - run: bash -n install.sh resdesk.sh upgrade.sh scripts/*.sh docker/create-site.sh

  docker-install:
    name: Docker install + integration tests
    runs-on: ubuntu-latest
    needs: lint-and-unit
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install with the same script librarians use
        run: ./install.sh --yes --no-sample
      - name: Frappe integration tests (catalogue, access, pushing, pause/resume, quiet hours, moving)
        run: |
          ./resdesk.sh bench set-config allow_tests true
          docker compose exec -T backend bench --site resdesk.localhost run-tests --app sok_resdesk
      - name: Background workers run at low priority
        run: |
          # the nice level of each worker process (field 19 of /proc/PID/stat): 19 unless WORKER_NICE is set
          docker compose exec -T queue sh -c 'for p in /proc/[0-9]*; do [ "$p" = /proc/$$ ] && continue; tr "\0" " " < $p/cmdline 2>/dev/null | grep -q "bench_helper frappe worker" && cut -d" " -f19 $p/stat; done' \
            | tee /dev/stderr | awk '{n++} $1 != 19 {bad=1} END {exit bad || !n}'
      - name: Small live ingest from the Internet Archive
        run: ./resdesk.sh ingest --collection ServantsOfKnowledge --filter "language:eng" --limit 3
      - name: Page images from archive.org (the page reader's address)
        # informational: archive.org being slow must not block a release
        continue-on-error: true
        run: |
          ID=$(curl -fsS "http://localhost:8080/api/method/sok_resdesk.api.search?q=" | python3 -c "import json,sys; print(json.load(sys.stdin)['message']['hits'][0]['item_id'])")
          curl -fsSL -o /tmp/page.jpg -w "%{http_code} %{content_type} %{size_download} bytes\n" "https://archive.org/download/$ID/page/n1.jpg"
          file /tmp/page.jpg | grep -qi "image" || { echo "::warning::archive.org page image for $ID is not an image"; exit 1; }
      - name: Smoke-test public endpoints
        run: |
          set -e
          B=http://localhost:8080
          curl -fsS "$B/library" > /dev/null
          curl -fsS "$B/api/method/sok_resdesk.api.search?q=india" | grep -q '"hits"'
          curl -fsS "$B/api/method/sok_resdesk.oai.endpoint?verb=Identify" | grep -q "<Identify>"
          curl -fsS "$B/api/method/sok_resdesk.api.stats"
      - name: Move an install - export, then import the archive back
        run: |
          set -e
          before=$(docker compose exec -T backend bench --site resdesk.localhost execute frappe.db.count --args '["RD Item"]' | tail -1)
          ./resdesk.sh export site-backups/ci-move.tar.gz
          ./resdesk.sh import site-backups/ci-move.tar.gz --yes
          after=$(docker compose exec -T backend bench --site resdesk.localhost execute frappe.db.count --args '["RD Item"]' | tail -1)
          echo "books before: $before, after: $after"; [ "$before" = "$after" ]
          curl -fsS http://localhost:8080/library > /dev/null
          rm -f site-backups/ci-move.tar.gz
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200
