{# facets, toolbar, results and pager #}
	<div class="rd-layout">
		<aside class="rd-facets" id="rd-facets" aria-label="{{ _('Filters') }}">
			<h2 class="rd-sr-only">{{ _("Filters") }}</h2>
			<div class="rd-facet">
				<h3>{{ _("Year") }}</h3>
				<div class="rd-years">
					<input type="number" id="rd-year-from" placeholder="{{ _('from') }}" aria-label="{{ _('From year') }}" min="1000" max="2100">
					<input type="number" id="rd-year-to" placeholder="{{ _('to') }}" aria-label="{{ _('To year') }}" min="1000" max="2100">
				</div>
			</div>
			<div id="rd-facet-lists"></div>
		</aside>

		<section class="rd-results" aria-labelledby="rd-results-h">
			<h2 class="rd-sr-only" id="rd-results-h">{{ _("Results") }}</h2>
			<div class="rd-toolbar">
				<div id="rd-summary" class="rd-muted" role="status"></div>
				<div id="rd-also" class="rd-muted rd-also" hidden></div>
				<div class="rd-toolbar__right">
					<select id="rd-sort" aria-label="{{ _('Sort') }}">
						<option value="relevance">{{ _("Relevance") }}</option>
						<option value="year:asc">{{ _("Oldest first") }}</option>
						<option value="year:desc">{{ _("Newest first") }}</option>
						<option value="title_sort:asc">{{ _("Title A–Z") }}</option>
					</select>
					<div class="rd-basket" id="rd-basket">
						<button class="rd-btn" id="rd-basket-btn" type="button">
							{{ _("My list") }} <span class="rd-badge" id="rd-basket-count">0</span>
						</button>
						<div class="rd-basket__menu" id="rd-basket-menu" hidden>
							<p class="rd-muted">{{ _("Export all saved items:") }}</p>
							<a data-fmt="bibtex">BibTeX</a>
							<a data-fmt="ris">RIS (Zotero, Mendeley, EndNote)</a>
							<a data-fmt="csl-json">CSL-JSON</a>
							<a data-fmt="apa">APA</a>
							<a data-fmt="marc">MARCXML (Koha)</a>
							<a data-action="share">{{ _("Copy share link") }}</a>
							<a data-action="clear" class="rd-danger">{{ _("Clear list") }}</a>
						</div>
					</div>
				</div>
			</div>
			<div id="rd-active-filters" class="rd-chips"></div>
			<ol id="rd-hits" class="rd-hits"></ol>
			<nav id="rd-pager" class="rd-pager" aria-label="{{ _('Pages') }}"></nav>
		</section>
	</div>
