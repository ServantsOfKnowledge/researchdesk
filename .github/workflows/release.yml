# Tags and publishes a release whenever main carries a version that has no tag yet.
#
# The Server page's update check (and ./upgrade.sh) find releases by their v* tag, so a version
# that is merged but not tagged is invisible to every install. scripts/release.sh makes the tag
# on a maintainer's machine; this does the same from GitHub, so a release never waits for one.
#   - after CI passes on main: if sok_resdesk/__init__.py's version has no tag, tag it (a version
#     whose tests fail is never released: installs would offer it as an upgrade)
#   - by hand (Actions → Release → Run workflow): the same, for the current main
# The version must also head CHANGELOG.md ("## X.Y.Z (date): …"); its section is the release notes.
name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the tag and the release
  actions: write # start the Docker image build for the tag (see the last step)

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # the commit CI tested (by hand: the current main)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Version and tag
        id: v
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^__version__ = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' sok_resdesk/__init__.py)
          [ -n "$VERSION" ] || { echo "No X.Y.Z __version__ in sok_resdesk/__init__.py"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already tagged: nothing to release."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the changelog and build the release notes
        if: steps.v.outputs.new == 'true'
        run: |
          set -euo pipefail
          V='${{ steps.v.outputs.version }}'
          top=$(grep -m1 '^## ' CHANGELOG.md | awk '{print $2}')
          [ "$top" = "$V" ] || { echo "CHANGELOG.md must start with a '## $V (date): …' entry (it starts with $top)."; exit 1; }
          # the notes: everything under the first heading, up to the next one
          awk '/^## /{n++; next} n==1' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
      - name: Tag and publish the release
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V='${{ steps.v.outputs.version }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "v$V" "$(git rev-parse HEAD)"
          git push origin "refs/tags/v$V"
          gh release create "v$V" --verify-tag --title "v$V" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Build the Docker image for the tag
        if: steps.v.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a tag pushed with the workflow's own token does not start other workflows, so ask for it
          gh workflow run docker-image.yml --ref "v${{ steps.v.outputs.version }}"
