# SOK Research Desk: full stack in Docker.
#
# Most people should run ./install.sh instead of using this file directly.
# It creates .env with random passwords, builds the image and creates the site.
#
#   docker compose up -d          start
#   docker compose down           stop (data is kept in volumes)
#   ./resdesk.sh help             everyday commands

name: sok-resdesk

x-image: &image
  image: ${RESDESK_IMAGE:-sok-resdesk}:${RESDESK_TAG:-local}
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      FRAPPE_BRANCH: ${FRAPPE_BRANCH:-version-16}
      FRAPPE_IMAGE_PREFIX: ${FRAPPE_IMAGE_PREFIX:-frappe}
      # a new value rebuilds Frappe: upgrade.sh sets it to the newest v16 release when there is one
      FRAPPE_COMMIT: ${FRAPPE_COMMIT:-}
  restart: unless-stopped

# Resource caps (./resdesk.sh resources). "0" or empty means no limit.
x-limits-queue: &limits-queue
  resources:
    limits:
      cpus: "${QUEUE_CPUS:-0}"
      memory: "${QUEUE_MEMORY:-0}"

x-backend: &backend
  <<: *image
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs
    # Your folder of IA-style item folders (local disk, USB or a mounted NAS share),
    # read-only. Set LIBRARY_DIR in .env; ingest profiles see it as /library-source.
    - ${LIBRARY_DIR:-./library}:/library-source:ro
    # The library's own copies of its books (Settings → Preservation → Preservation Folder:
    # /preservation). A Docker volume unless PRESERVATION_DIR names a host folder (a disk or NAS
    # mount, writable by uid 1000).
    - ${PRESERVATION_DIR:-preservation-data}:/preservation
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
      - --innodb-buffer-pool-size=${DB_BUFFER_POOL:-256M}
    deploy:
      resources:
        limits:
          cpus: "${DB_CPUS:-0}"
          memory: "${DB_MEMORY:-0}"
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?run ./install.sh first}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:7-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  meilisearch:
    image: getmeili/meilisearch:${MEILI_VERSION:-v1.54}
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?run ./install.sh first}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
      # upgrade the index files in place when a newer Meilisearch patch release is pulled
      MEILI_UPGRADE_DB: "true"
      # how hard indexing may work (./resdesk.sh resources); empty = Meilisearch decides
      MEILI_MAX_INDEXING_THREADS: ${MEILI_MAX_INDEXING_THREADS:-}
      MEILI_MAX_INDEXING_MEMORY: ${MEILI_MAX_INDEXING_MEMORY:-}
      # at most this many queued tasks in one indexing batch: smaller batches finish (and are kept)
      # sooner, and one that runs out of memory doesn't take the whole queue back to the start
      MEILI_EXPERIMENTAL_MAX_NUMBER_OF_BATCHED_TASKS: ${MEILI_MAX_BATCHED_TASKS:-50}
    command:
      - /bin/sh
      - -c
      - >
        [ -n "$$MEILI_MAX_INDEXING_THREADS" ] || unset MEILI_MAX_INDEXING_THREADS;
        [ -n "$$MEILI_MAX_INDEXING_MEMORY" ] || unset MEILI_MAX_INDEXING_MEMORY;
        exec /bin/meilisearch
    deploy:
      resources:
        limits:
          cpus: "${MEILI_CPUS:-0}"
          memory: "${MEILI_MEMORY:-0}"
    volumes:
      - meili-data:/meili_data

  # One-shot: writes common_site_config.json (DB + Redis hosts)
  configurator:
    <<: *image
    restart: on-failure
    entrypoint: ["bash", "-c"]
    command:
      - >
        python3 -c "import json; json.load(open('sites/common_site_config.json'))" 2>/dev/null
        || { echo "common_site_config.json was empty or damaged (disk full?): recreating it"; echo "{}" > sites/common_site_config.json; };
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host db;
        bench set-config -gp db_port 3306;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;
        bench set-config -gp background_process_niceness 0;
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on: {}

  # One-shot: creates the site and installs Research Desk (skipped if it exists)
  create-site:
    <<: *backend
    restart: "no"
    entrypoint: ["/usr/local/bin/entrypoint.sh"]
    command: ["create-site.sh"]
    environment:
      SITE_NAME: ${SITE_NAME:-resdesk.localhost}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?run ./install.sh first}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      PORTAL_TITLE: ${PORTAL_TITLE:-SOK Research Desk}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      BASE_URL: ${BASE_URL:-}
      FORCE_MIGRATE: ${FORCE_MIGRATE:-0}
      TIMEZONE: ${TIMEZONE:-Asia/Kolkata}
      COUNTRY: ${COUNTRY:-India}
      CURRENCY: ${CURRENCY:-INR}
    depends_on:
      configurator:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      meilisearch:
        condition: service_started

  backend:
    <<: *backend
    environment:
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      RESDESK_DOCKER_API: http://monitor:2375
      # shown on Background Jobs → Machine (the app can't change them: ./resdesk.sh resources)
      RESDESK_RESOURCES: >-
        preset=${RESOURCES_PRESET:-standard};workers=${QUEUE_WORKERS:-2};per_container=${WORKERS_PER_CONTAINER:-1};worker_cpus=${QUEUE_CPUS:-0};worker_memory=${QUEUE_MEMORY:-0};worker_nice=${WORKER_NICE:-19};search_cpus=${MEILI_CPUS:-0};search_memory=${MEILI_MEMORY:-0};search_threads=${MEILI_MAX_INDEXING_THREADS:-};db_cpus=${DB_CPUS:-0};db_memory=${DB_MEMORY:-0};db_buffer_pool=${DB_BUFFER_POOL:-256M};web_workers=${GUNICORN_WORKERS:-2}

  websocket:
    <<: *backend
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]

  # Background workers. Each one processes one ingest batch at a time, so
  # QUEUE_WORKERS=4 ingests about four books at once. 2 to 4 is polite to archive.org.
  # They run at the lowest CPU priority (WORKER_NICE, 19) and low disk priority so the portal
  # stays quick; give them more with ./resdesk.sh resources set WORKER_NICE=10 (0 = normal).
  # WORKERS_PER_CONTAINER=N runs N workers inside each container (a Frappe worker pool): for
  # hosts that give every container a fixed name and so can't run copies, like Coolify.
  queue:
    <<: *backend
    command: ["nice", "-n", "${WORKER_NICE:-19}", "ionice", "-c", "2", "-n", "7", "sh", "-c",
              "if [ ${WORKERS_PER_CONTAINER:-1} -gt 1 ]; then exec bench worker-pool --num-workers ${WORKERS_PER_CONTAINER:-1} --queue short,default,long; else exec bench worker --queue short,default,long; fi"]
    # Quick jobs (short, default: schedules, emails, housekeeping) come before the long ingest
    # batches whenever a worker is free, so they never wait behind hours of ingesting.
    # ulimits nice: a worker may lower its own niceness down to -20, which is what makes
    # Background Jobs → Machine → Worker priority work live in both directions (without it a
    # process can only be made nicer, never less nice).
    ulimits:
      nice:
        soft: 40
        hard: 40
    deploy:
      replicas: ${QUEUE_WORKERS:-2}
      <<: *limits-queue

  scheduler:
    <<: *backend
    command: ["bench", "schedule"]

  # Optional (./resdesk.sh resources monitor on): lets Background Jobs show CPU and memory
  # per part. A read-only proxy in front of the Docker socket: it can list containers and
  # their usage, nothing else (no starting, stopping or creating).
  monitor:
    image: tecnativa/docker-socket-proxy:v0.5.0
    profiles: ["monitor"]
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0
      EVENTS: 0
      DISABLE_IPV6: 1
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro

  # Optional (./resdesk.sh updater on): the updater helper, which lets the Server page in the
  # Desk upgrade, restart and back up this install (docs/server.md). It controls Docker and
  # can change this folder, so it is off unless you turn it on; it only runs ./upgrade.sh,
  # ./resdesk.sh and docker compose for the tasks a System Manager starts in the Desk.
  updater:
    image: sok-resdesk-updater:local
    build:
      context: docker
      dockerfile: updater.Dockerfile
    profiles: ["updater"]
    restart: unless-stopped
    working_dir: ${RESDESK_DIR:-/resdesk}
    command: ["python3", "scripts/agent.py"]
    user: "${RESDESK_UID:-0}:${RESDESK_GID:-0}"
    group_add: ["${DOCKER_GID:-0}"]
    environment:
      RESDESK_DIR: ${RESDESK_DIR:-/resdesk}
      RESDESK_AGENT_URL: http://frontend:8080
      RESDESK_IN_DOCKER: "1"
    volumes:
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      # the install folder at the same path as on the host, so docker compose run from
      # inside finds the same files (.env, compose.yaml, library) the host does
      - ${RESDESK_DIR:-.}:${RESDESK_DIR:-/resdesk}

  frontend:
    <<: *image
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-resdesk.localhost}
      # the HTTPS proxy's network (./resdesk.sh https on), so visitors' own addresses reach Frappe
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      # HTTP_BIND=127.0.0.1: (set by ./resdesk.sh https on) keeps this port to the server itself
      - "${HTTP_BIND:-}${HTTP_PORT:-8080}:8080"
    depends_on:
      - backend
      - websocket

volumes:
  preservation-data:
  db-data:
  redis-queue-data:
  meili-data:
  sites:
  logs:
